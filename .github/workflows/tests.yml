name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DB_USER: root
      DB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        cfengine: [ "boxlang@1" ]
        coldboxVersion: [ "^8.0.0" ]
        experimental: [ false ]
        include:
          - coldboxVersion: "be"
            cfengine: "boxlang@1"
            experimental: true
          - coldboxVersion: "^8.0.0"
            cfengine: "boxlang@be"
            experimental: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Environment For Testing Process
        run: |
          # Setup .env
          touch .env
          # ENV
          printf "ENVIRONMENT=development\n" >> .env
          printf "DB_HOST=localhost\n" >> .env
          printf "DB_USER=${{ env.DB_USER }}\n" >> .env
          printf "DB_PASSWORD=${{ env.DB_PASSWORD }}\n" >> .env
          printf "DB_CLASS=com.mysql.cj.jdbc.Driver\n" >> .env

      - name: Setup CommandBox CLI
        uses: ortus-boxlang/setup-boxlang@1.6.0
        with:
          modules: bx-cli

      # On its first run CommandBox installs its own modules (commandbox-cfconfig, commandbox-dotenv, the
      # testbox commands and the packages they need) from ForgeBox. A failed download there (a timeout, a
      # 502, a connection reset) does not fail the run, but it leaves modules missing or half-installed, and
      # a later box command then fails with 'Command "testbox run ..." cannot be resolved'. So do that first
      # run here, and accept it only when nothing failed: no failed install, no module that failed to load,
      # and the testbox command resolves. Otherwise start over from a clean CommandBox home, with a backoff.
      - name: Warm Up CommandBox
        run: |
          for attempt in 1 2 3 4 5; do
            out=$( { box version; box testbox run help; } 2>&1 || true )
            if ! grep -qE "× \||ERROR \(|cannot be resolved|failed to load" <<< "$out"; then
              echo "CommandBox is ready (attempt $attempt)"
              exit 0
            fi
            echo "$out" | grep -E "× \||ERROR \(|cannot be resolved|failed to load|ForgeBox returned|Request Timeout|Bad Gateway|Connection" || true
            echo "::warning::CommandBox did not finish installing its modules (attempt $attempt), retrying from a clean CommandBox home"
            rm -rf "$HOME/.CommandBox"
            sleep $(( attempt * 15 ))
          done
          echo "::error::CommandBox could not install its modules after 5 attempts"
          exit 1

      - name: Install Dependencies
        run: |
          box install
          cd test-harness
          box package set dependencies.coldbox=${{ matrix.coldboxVersion }}
          box install

      - name: Start ${{ matrix.cfengine }} Server
        run: |
          box server start serverConfigFile="server-${{ matrix.cfengine }}.json" --noSaveSettings --debug
          curl http://127.0.0.1:60299

      - name: Run Tests
        run: |
          mkdir -p test-harness/tests/results
          box testbox run --verbose outputFile=test-harness/tests/results/test-results outputFormats=json,antjunit

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@v6.5.0
        if: always()
        with:
          report_paths: |
            test-harness/tests/results/**/*.xml
          check_name: "TestBox Report ${{ matrix.cfengine }}-${{ matrix.coldboxVersion }}"
          include_passed: false
          fail_on_failure: true
          detailed_summary: true

      - name: Upload Test Results to Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.cfengine }}-${{ matrix.coldboxVersion }}
          path: |
            test-harness/tests/results/**/*

      - name: Show Server Log On Failures
        if: ${{ failure() }}
        run: |
          box server log serverConfigFile="server-${{ matrix.cfengine }}.json"

      - name: Upload Debug Logs To Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: Failure Debugging Info - ${{ matrix.cfengine }} - ${{ matrix.coldboxVersion }}
          path: |
            .engine/**/logs/*

      - name: Slack Notifications
        # Only on failures and NOT in pull requests
        if: ${{ failure() && !startsWith( github.event_name, 'pull_request' ) }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: coding
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: '${{ github.repository }} tests failed :cry:'
          SLACK_TITLE: ${{ github.repository }} Tests For ${{ matrix.cfengine }} with ColdBox ${{ matrix.coldboxVersion }} failed
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
